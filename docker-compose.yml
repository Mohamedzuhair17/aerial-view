services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aerial_db}
      POSTGRES_USER: ${POSTGRES_USER:-aerial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aerial} -d ${POSTGRES_DB:-aerial_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      args:
        INSTALL_ML: ${INSTALL_ML:-0}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_BACKEND: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-aerial}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aerial_db}
      JOB_QUEUE_BACKEND: rq
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /srv/data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - aerial_data:/srv/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      API_KEY: ${API_KEY:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  worker:
    gpus: all
    build:
      context: .
      args:
        INSTALL_ML: "1"
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      DATABASE_BACKEND: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-aerial}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aerial_db}
      JOB_QUEUE_BACKEND: rq
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /srv/data
    volumes:
      - aerial_data:/srv/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgis_data:
  redis_data:
  aerial_data:
